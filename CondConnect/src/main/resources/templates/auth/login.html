<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login CondConnect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .login-container {
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 0px 0px 10px #ccc;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error, .msg {
            text-align: center;
            color: red;
            margin-bottom: 10px;
        }
        .msg {
            color: green;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login CondConnect</h2>

        <!-- Mensagens de erro ou logout -->
        <div th:if="${errorMsg}" class="error" th:text="${errorMsg}"></div>
        <div th:if="${msg}" class="msg" th:text="${msg}"></div>
<form th:action="@{/auth/login}" method="post">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <label>Usuário:</label>
    <input type="text" name="username" required />

    <label>Senha:</label>
    <input type="password" name="password" required />

    <button type="submit">Entrar</button>
</form>
    </div>
</body>
</html>
